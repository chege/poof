version: '3'

tasks:
  build:
    desc: Build the dbmask binary
    cmds:
      - go build -v -o dbmask ./cmd/dbmask

  clean:
    desc: Remove the dbmask binary and test artifacts
    cmds:
      - rm -f dbmask

  rebuild:
    desc: Clean and rebuild the binary
    cmds:
      - task: clean
      - task: build

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  ready:
    desc: Prepare code (tidy, lint) and run tests
    cmds:
      - task: tidy
      - task: lint
      - task: test

  doctor:
    desc: Run environment readiness check
    cmds:
      - ./dbmask doctor --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "dbmask.hcl"}}"
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  validate:
    desc: Validate the configuration file
    cmds:
      - ./dbmask validate --config "{{.CONFIG_PATH | default "dbmask.hcl"}}"

  verify:
    desc: Verify environment and configuration (doctor + validate)
    cmds:
      - task: doctor
      - task: validate

  init:
    desc: Initialize the project
    cmds:
      - ./dbmask init --explain

  plan:
    desc: Show masking plan
    cmds:
      - ./dbmask plan --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "dbmask.hcl"}}"
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  apply:
    desc: Apply masking rules
    cmds:
      - ./dbmask apply --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "dbmask.hcl"}}" --yes
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  all:
    desc: Run full quality gate and build
    cmds:
      - task: ready
      - task: build

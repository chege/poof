version: '3'

tasks:
  build:
    desc: Build the poof binary
    cmds:
      - go build -v -o poof ./cmd/poof

  clean:
    desc: Remove the poof binary and test artifacts
    cmds:
      - rm -f poof

  rebuild:
    desc: Clean and rebuild the binary
    cmds:
      - task: clean
      - task: build

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  cover:
    desc: Run tests with coverage and show summary
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  cover-html:
    desc: Run tests with coverage and show HTML report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  fmt:
    desc: Format code and sort imports
    cmds:
      - task: tidy
      - golangci-lint run --fix ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  ready:
    desc: Prepare code (fmt, lint) and run tests
    cmds:
      - task: fmt
      - task: lint
      - task: test

  doctor:
    desc: Run environment readiness check
    cmds:
      - ./poof doctor --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "poof.hcl"}}"
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  validate:
    desc: Validate the configuration file
    cmds:
      - ./poof validate --config "{{.CONFIG_PATH | default "poof.hcl"}}"

  verify:
    desc: Verify environment and configuration (doctor + validate)
    cmds:
      - task: doctor
      - task: validate

  init:
    desc: Initialize the project
    cmds:
      - ./poof init --explain

  plan:
    desc: Show masking plan
    cmds:
      - ./poof plan --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "poof.hcl"}}"
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  apply:
    desc: Apply masking rules
    cmds:
      - ./poof apply --db "{{.DB_URL}}" --config "{{.CONFIG_PATH | default "poof.hcl"}}" --yes
    vars:
      DB_URL: '{{.DB_URL | default "postgres://user:pass@localhost:5432/testdb"}}'

  all:
    desc: Run full quality gate and build
    cmds:
      - task: ready
      - task: build

  demo:
    desc: Run a self-contained poof demo
    cmds:
      - docker compose -f demo/docker-compose.yml up -d --wait
      - docker exec -i $(docker compose -f demo/docker-compose.yml ps -q db) psql -U poof -d poof_demo < demo/demo.sql
      - go run ./cmd/poof plan --config demo/poof.toml
      - echo "---"
      - echo "To apply the masking, run:"
      - echo "go run ./cmd/poof apply --config demo/poof.toml"

  demo:clean:
    desc: Stop and remove demo containers
    cmds:
      - docker compose -f demo/docker-compose.yml down -v

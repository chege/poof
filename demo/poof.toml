# poof demo configuration

[databases.local]
dsn = "postgres://poof:poof@localhost:5432/poof_demo?sslmode=disable"
default = true

[databases.docker]
dsn = "postgres://poof:poof@db:5432/poof_demo?sslmode=disable"

batch_size = 100

[safety]
allowed_db_names = ["poof_demo"]
salt = "demo-secret-salt"

locale = "de_DE"

[[tables]]
name = "users"
pk = "id"

  [tables.source]
  filter = "id > 0" # Example filter

  [[tables.columns]]
  name = "full_name"

    [tables.columns.gen]
    type = "faker"
    provider = "full_name"

  [[tables.columns]]
  name = "username"

    [tables.columns.gen]
    type = "template"
    template = "USER-{{ counter }}-{{ faker \"first_name\" }}"

  [[tables.columns]]
  name = "email"

    [tables.columns.gen]
    type = "faker"
    provider = "email"

  [[tables.columns]]
  name = "company"

    [tables.columns.gen]
    type = "faker"
    provider = "company_name"

  [[tables.columns]]
  name = "phone"

    [tables.columns.gen]
    type = "faker"
    provider = "phone_number"

  [[tables.columns]]
  name = "bio"

    [tables.columns.gen]
    type = "faker"
    provider = "short_text"
